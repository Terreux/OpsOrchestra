server {
    listen 127.0.0.1:8081;
    server_name localhost;

    server_tokens off;

    access_log /var/log/nginx/opsorchestra-agent.access.log;
    error_log  /var/log/nginx/opsorchestra-agent.error.log warn;

    client_max_body_size 10m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 60s;

    location / {
        proxy_pass https://jenkins.example.com;

        proxy_http_version 1.1;

        proxy_set_header Host jenkins.example.com;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        include /etc/opsorchestra/cloudflare-jenkins.conf;

        proxy_ssl_server_name on;
        proxy_ssl_name jenkins.example.com;

        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_buffering off;
    }
}